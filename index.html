<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 引用真实存在的图标资源，避免浏览器回退请求 /favicon.ico 触发 clientError 警告 -->
    <link rel="icon" type="image/png" href="/saibo-shanhai/images/ai-generated/ui-icons/icon_skills.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShanHai 赛博山海经</title>
    <!-- 入口页使用的展示字体：Noto Serif SC（中文衬线·稳重）+ ZCOOL XiaoWei（中文装饰）+ Orbitron（拉丁科幻） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=ZCOOL+XiaoWei&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- v1.x FOUC 防护：应用启动前同步读取字号缩放偏好，立即写入 :root CSS 变量，
         避免首屏文字闪烁。仅缩放文字，UI 尺寸（icon/按钮/面板）不受影响。
         默认 100% 时不写任何 inline style，行为完全等价于无缩放。 -->
    <script>
      (function () {
        try {
          var SCALES = [0.8, 0.9, 1.0, 1.15, 1.3];
          var raw = localStorage.getItem('cybershanhai_font_scale_index');
          var idx = raw == null ? 2 : parseInt(raw, 10);
          if (isNaN(idx) || idx < 0 || idx > 4) idx = 2;
          var scale = SCALES[idx];
          // 仅当非默认值时写 inline CSS 变量；默认值（100%）走 main.css 默认
          if (scale !== 1.0) {
            document.documentElement.style.setProperty('--app-font-scale', String(scale));
          }
        } catch (e) {
          // localStorage 不可用时静默忽略，使用默认字号
        }
      })();
    </script>
    <script type="module" crossorigin src="/saibo-shanhai/assets/index-BCmxRwz0.js"></script>
    <link rel="stylesheet" crossorigin href="/saibo-shanhai/assets/index-CDu2Qtlx.css">
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div id="app"></div>
  </body>
</html>
